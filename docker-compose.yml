version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: lms_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: lms_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password123@mongodb:27017/lms_db?authSource=admin
      PORT: 5000
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      JWT_EXPIRE: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - lms_network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  lms_network:
    driver: bridge
